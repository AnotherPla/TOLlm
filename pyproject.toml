[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tollm"
version = "0.1.0"
authors = [{ name = "Jianxin Chen" }]
description = "轻量级大模型推理引擎（基于 nano-vllm 思路）"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { file = "LICENSE" }
dependencies = [
  "torch>=2.4.0",
  "triton>=3.0.0",
  "transformers>=4.51.0",
  "flash-attn",
  "xxhash",
]

[project.urls]
Homepage="https://github.com/AnotherPla/TOLlm"

[tool.setuptools.packages.find]
where = ["src"]
include = ["tollm*"]
